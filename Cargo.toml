[package]
name = "apex5"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
ksni = { version = "0.3.6", features = ["blocking"] }
libc = "0.2.190"
resvg = { version = "0.48", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt"] }
ureq = "3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
